<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoFo Music | Private Session</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0d0d0d; --gold: #c5a367; --soft: #e5e5e5; --muted: #666666; --serif: 'Cormorant Garamond', serif; --sans: 'Montserrat', sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--soft); font-family: var(--sans); min-height: 100vh; overflow-x: hidden; }
        .hidden { display: none !important; }
        
        /* AUTH UI */
        .auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #111; padding: 30px; border-radius: 8px; width: 100%; max-width: 350px; border: 1px solid #222; text-align: center; }
        .auth-card h2 { font-family: var(--serif); color: var(--gold); margin-bottom: 25px; letter-spacing: 5px; }
        .auth-card input { width: 100%; padding: 14px; margin-bottom: 12px; background: #000; border: 1px solid #333; color: white; border-radius: 4px; outline: none; }
        .auth-btn { width: 100%; padding: 14px; background: var(--gold); border: none; font-weight: 600; cursor: pointer; border-radius: 4px; margin-top: 10px; color: black; }
        .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* ERROR MESSAGE */
        .error-message { color: #ff4b2b; font-size: 12px; margin-top: 5px; text-align: left; }
        
        /* NAV & TABS */
        nav { display: flex; justify-content: center; padding: 15px; border-bottom: 1px solid #1a1a1a; background: var(--bg); position: sticky; top: 0; z-index: 100; }
        .tabs { display: flex; justify-content: center; gap: 30px; margin: 20px 0; }
        .tab { font-size: 12px; color: var(--muted); cursor: pointer; letter-spacing: 2px; text-transform: uppercase; padding-bottom: 5px; border-bottom: 2px solid transparent; transition: 0.3s; }
        .tab.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

        /* SEARCH & CONTENT */
        .hero { display: flex; flex-direction: column; align-items: center; padding: 0 20px; }
        .search-box { width: 100%; max-width: 500px; margin-bottom: 25px; display: flex; gap: 8px; }
        .search-box input { flex: 1; padding: 14px; background: #111; border: 1px solid #222; color: white; outline: none; border-radius: 4px; }
        .container { width: 100%; max-width: 800px; margin: auto; padding-bottom: 140px; }
        .section-title { font-family: var(--serif); color: var(--gold); font-size: 18px; margin: 15px 0; border-bottom: 1px solid #1a1a1a; padding-bottom: 5px; }
        
        /* LOADING SPINNER */
        .spinner { border: 3px solid #333; border-top: 3px solid var(--gold); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .track { padding: 12px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #111; cursor: pointer; }
        .track:hover { background: #1a1a1a; }
        .track img { width: 50px; height: 50px; border-radius: 4px; object-fit: cover; }
        .track-meta { flex: 1; overflow: hidden; }
        .track-meta div:first-child { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-meta div:last-child { font-size: 10px; color: var(--muted); text-transform: uppercase; }

        /* PLAYER */
        .player { position: fixed; bottom: 0; width: 100%; background: #050505; border-top: 1px solid #1a1a1a; padding: 12px 20px; display: flex; align-items: center; gap: 15px; z-index: 1000; }
        #yt-player { position: absolute; opacity: 0; pointer-events: none; }
        .p-thumb { width: 45px; height: 45px; border-radius: 4px; object-fit: cover; }
        .player-info { flex: 1; min-width: 0; }
        #pTitle { font-family: var(--serif); font-size: 14px; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .controls { display: flex; align-items: center; gap: 15px; }
        .like-icon { font-size: 20px; cursor: pointer; color: var(--muted); transition: 0.3s; }
        .like-icon.liked { color: #ff4b2b; }
        .play-btn { background: var(--gold); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; color: black; }
        #progress-bar { width: 100%; height: 3px; background: #222; position: absolute; top: 0; left: 0; cursor: pointer; }
        #progress-inner { height: 100%; background: var(--gold); width: 0%; }
        
        /* EMPTY STATE */
        .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
        .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
        
        /* MESSAGES */
        .message { padding: 10px; margin: 10px 0; border-radius: 4px; text-align: center; }
        .success { background: rgba(197, 163, 103, 0.1); border: 1px solid var(--gold); color: var(--gold); }
        .error { background: rgba(255, 75, 43, 0.1); border: 1px solid #ff4b2b; color: #ff4b2b; }
    </style>
</head>
<body>

<div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
        <h2 id="authTitle">VOFO</h2>
        <input type="text" id="username" placeholder="Username" autocomplete="username">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password">
        <div id="authError" class="error-message hidden"></div>
        <button class="auth-btn" onclick="handleAuth()" id="authButton">CONTINUE</button>
        <p id="authSwitch" style="font-size: 11px; margin-top: 20px; color: var(--muted); cursor: pointer;" onclick="toggleAuthMode()">New here? Create account</p>
    </div>
</div>

<div id="mainApp" class="hidden">
    <nav><div style="font-family: var(--serif); color:var(--gold); letter-spacing: 4px; font-size: 20px;">VOFO MUSIC</div></nav>
    
    <div class="hero">
        <div class="tabs">
            <div id="tabExp" class="tab active" onclick="switchTab('explore')">Explore</div>
            <div id="tabLib" class="tab" onclick="switchTab('library')">Library</div>
        </div>

        <div id="exploreView" style="width: 100%; max-width: 500px;">
            <div class="search-box">
                <input id="searchInput" placeholder="Search artists or tracks..." onkeypress="if(event.key==='Enter') doSearch()">
                <button class="auth-btn" style="margin:0; width:60px;" onclick="doSearch()">GO</button>
            </div>
            <div class="container">
                <div id="statusHeader" class="section-title">Trending</div>
                <div id="loading" class="hidden"><div class="spinner"></div></div>
                <div id="messageContainer"></div>
                <div id="results"></div>
                <div id="emptyState" class="empty-state hidden">
                    <div class="icon">🎵</div>
                    <p>No songs found</p>
                </div>
            </div>
        </div>

        <div id="libraryView" class="container hidden">
            <div class="section-title">Liked Songs</div>
            <div id="loadingLiked" class="hidden"><div class="spinner"></div></div>
            <div id="likedResults"></div>
            <div id="emptyLiked" class="empty-state hidden">
                <div class="icon">❤️</div>
                <p>No liked songs yet</p>
            </div>
        </div>
    </div>
</div>

<div class="player hidden" id="playerBar">
    <div id="progress-bar" onclick="seek(event)"><div id="progress-inner"></div></div>
    <div id="yt-player"></div>
    <img id="pThumb" class="p-thumb" src="" alt="Album cover">
    <div class="player-info">
        <div id="pTitle">Select a song to play</div>
        <div id="pArtist" style="font-size: 10px; color: var(--muted);">VoFo Music</div>
    </div>
    <div class="controls">
        <div id="likeBtn" class="like-icon" onclick="toggleLikeCurrent()">❤</div>
        <button id="playBtn" class="play-btn" onclick="togglePlay()">▶</button>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    let player, currentUser = null, isLoginMode = true;
    let currentPlaylist = [], currentIndex = -1;
    let isPlaying = false;

    // --- AUTH LOGIC ---
    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('authTitle').innerText = isLoginMode ? "VOFO" : "REGISTER";
        document.getElementById('authSwitch').innerText = isLoginMode ? "New here? Create account" : "Have an account? Login";
        hideAuthError();
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
    }

    async function handleAuth() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        const authBtn = document.getElementById('authButton');
        
        // Clear previous errors
        hideAuthError();
        
        // Validate inputs
        if(!u || !p) {
            showAuthError("Please fill in all fields");
            return;
        }
        
        if(u.length < 3) {
            showAuthError("Username must be at least 3 characters");
            return;
        }
        
        if(p.length < 6) {
            showAuthError("Password must be at least 6 characters");
            return;
        }
        
        // Disable button during request
        authBtn.disabled = true;
        authBtn.textContent = 'PLEASE WAIT...';
        
        try {
            const res = await fetch(isLoginMode ? '/api/login' : '/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });

            const data = await res.json();
            
            if(res.ok && data.success) {
                if(isLoginMode) {
                    currentUser = data;
                    document.getElementById('authOverlay').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    showMessage("Welcome back, " + u + "!", "success");
                    fetchTrending();
                } else {
                    // Registration successful, switch to login mode
                    showAuthError("Account created successfully! Please login.", "success");
                    setTimeout(() => {
                        toggleAuthMode();
                        hideAuthError();
                    }, 1500);
                }
            } else {
                showAuthError(data.detail || "Authentication failed");
            }
        } catch (error) {
            showAuthError("Network error. Please try again.");
        } finally {
            // Re-enable button
            authBtn.disabled = false;
            authBtn.textContent = 'CONTINUE';
        }
    }

    function showAuthError(message, type = "error") {
        const errorDiv = document.getElementById('authError');
        errorDiv.textContent = message;
        errorDiv.className = type === "error" ? "error-message" : "error-message success";
        errorDiv.classList.remove('hidden');
    }
    
    function hideAuthError() {
        document.getElementById('authError').classList.add('hidden');
    }

    // --- TAB LOGIC ---
    function switchTab(mode) {
        document.getElementById('exploreView').classList.toggle('hidden', mode === 'library');
        document.getElementById('libraryView').classList.toggle('hidden', mode === 'explore');
        document.getElementById('tabExp').classList.toggle('active', mode === 'explore');
        document.getElementById('tabLib').classList.toggle('active', mode === 'library');
        
        if(mode === 'library' && currentUser) {
            fetchLiked();
        }
    }

    // --- MESSAGE UTILITIES ---
    function showMessage(text, type = "success") {
        const container = document.getElementById('messageContainer');
        const msg = document.createElement('div');
        msg.className = `message ${type}`;
        msg.textContent = text;
        container.appendChild(msg);
        setTimeout(() => msg.remove(), 3000);
    }

    // --- MUSIC LOGIC ---
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('yt-player', {
            height: '0',
            width: '0',
            playerVars: {
                'autoplay': 0,
                'controls': 0,
                'disablekb': 1,
                'fs': 0,
                'modestbranding': 1,
                'rel': 0,
                'showinfo': 0
            },
            events: { 
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
        setInterval(updateProgress, 1000);
    }
    
    function onPlayerReady(event) {
        console.log("YouTube player ready");
    }
    
    function onPlayerStateChange(event) {
        const playBtn = document.getElementById('playBtn');
        if (event.data === YT.PlayerState.PLAYING) {
            playBtn.textContent = "||";
            isPlaying = true;
        } else if (event.data === YT.PlayerState.PAUSED) {
            playBtn.textContent = "▶";
            isPlaying = false;
        } else if (event.data === YT.PlayerState.ENDED) {
            skipNext();
        }
    }

    async function fetchTrending() {
        showLoading('loading');
        try {
            const res = await fetch('/api/trending');
            const data = await res.json();
            renderTracks(data, 'results');
            hideLoading('loading');
            if (data.length === 0) {
                showEmptyState('emptyState');
            }
        } catch (error) {
            console.error("Error fetching trending:", error);
            hideLoading('loading');
            showEmptyState('emptyState');
            showMessage("Failed to load trending songs", "error");
        }
    }

    async function doSearch() {
        const q = document.getElementById('searchInput').value.trim();
        if(!q) {
            showMessage("Please enter a search term", "error");
            return;
        }
        
        showLoading('loading');
        try {
            const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
            const data = await res.json();
            document.getElementById('statusHeader').innerText = "Search Results";
            renderTracks(data, 'results');
            hideLoading('loading');
            if (data.length === 0) {
                showMessage("No results found for: " + q, "error");
                showEmptyState('emptyState');
            }
        } catch (error) {
            console.error("Error searching:", error);
            hideLoading('loading');
            showEmptyState('emptyState');
            showMessage("Search failed. Please try again.", "error");
        }
    }

    function renderTracks(tracks, targetId) {
        const list = document.getElementById(targetId);
        const emptyDiv = targetId === 'results' ? 'emptyState' : 'emptyLiked';
        
        if (!tracks || tracks.length === 0) {
            list.innerHTML = '';
            showEmptyState(emptyDiv);
            return;
        }
        
        hideEmptyState(emptyDiv);
        
        // Escape quotes in JSON for onclick
        const safeTracks = JSON.stringify(tracks).replace(/"/g, '&quot;');
        
        list.innerHTML = tracks.map((s, i) => `
            <div class="track" onclick="startPlaylist(${i}, '${safeTracks}')">
                <img src="${s.thumbnail || ''}" alt="${s.title}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTAiIGhlaWdodD0iNTAiIHZpZXdCb3g9IjAgMCA1MCA1MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNTAiIGhlaWdodD0iNTAiIGZpbGw9IiMxMTExMTEiLz48cGF0aCBkPSJNMjUgMzJMMzIgMjVMMjUgMThWMzJaIiBmaWxsPSIjQzVBNjM3Ii8+PC9zdmc+'">
                <div class="track-meta">
                    <div>${s.title || 'Unknown'}</div>
                    <div>${s.artist || 'Unknown'}</div>
                </div>
            </div>
        `).join('');
    }

    function startPlaylist(index, tracksJson) {
        try {
            // Parse the tracks from the escaped JSON string
            const tracks = JSON.parse(tracksJson.replace(/&quot;/g, '"'));
            currentPlaylist = tracks;
            playSong(index);
        } catch (error) {
            console.error("Error parsing tracks:", error);
            showMessage("Error loading playlist", "error");
        }
    }

    function playSong(index) {
        if (!currentPlaylist || currentPlaylist.length === 0 || index < 0 || index >= currentPlaylist.length) {
            return;
        }
        
        currentIndex = index;
        const song = currentPlaylist[index];
        
        document.getElementById('playerBar').classList.remove('hidden');
        document.getElementById('pTitle').innerText = song.title || 'Unknown';
        document.getElementById('pArtist').innerText = song.artist || 'Unknown';
        document.getElementById('pThumb').src = song.thumbnail || '';
        document.getElementById('pThumb').alt = song.title || 'Album cover';
        
        if (player && player.loadVideoById) {
            player.loadVideoById(song.id);
            showMessage("Now playing: " + song.title, "success");
        }
        
        checkIfLiked(song.id);
    }

    function togglePlay() {
        if (!player) {
            showMessage("Player not ready yet", "error");
            return;
        }
        
        if (isPlaying) {
            player.pauseVideo();
        } else {
            player.playVideo();
        }
    }

    function skipNext() {
        if (currentPlaylist && currentIndex < currentPlaylist.length - 1) {
            playSong(currentIndex + 1);
        } else if (currentPlaylist && currentPlaylist.length > 0) {
            playSong(0);
        }
    }

    function seek(e) {
        if (!player || !player.getDuration) return;
        
        const bar = document.getElementById('progress-bar');
        const rect = bar.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / bar.offsetWidth;
        player.seekTo(pct * player.getDuration());
    }

    function updateProgress() {
        if (player && player.getDuration && player.getDuration() > 0) {
            const pct = (player.getCurrentTime() / player.getDuration()) * 100;
            document.getElementById('progress-inner').style.width = pct + "%";
        }
    }

    // --- LIKED SONGS LOGIC ---
    async function toggleLikeCurrent() {
        if (!currentUser || !currentPlaylist || currentIndex < 0) {
            showMessage("Please login to like songs", "error");
            return;
        }
        
        const song = currentPlaylist[currentIndex];
        if (!song || !song.id) {
            showMessage("No song selected", "error");
            return;
        }
        
        try {
            const res = await fetch('/api/like', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    user_id: currentUser.user_id,
                    song_id: song.id,
                    title: song.title,
                    artist: song.artist,
                    thumbnail: song.thumbnail
                })
            });
            
            const data = await res.json();
            if (res.ok) {
                const likeBtn = document.getElementById('likeBtn');
                const wasLiked = likeBtn.classList.contains('liked');
                likeBtn.classList.toggle('liked', data.status === 'liked');
                
                const message = data.status === 'liked' ? 'Added to liked songs' : 'Removed from liked songs';
                showMessage(message, "success");
                
                // Refresh liked songs if in library view
                if (!document.getElementById('libraryView').classList.contains('hidden')) {
                    fetchLiked();
                }
            } else {
                showMessage("Failed to update like", "error");
            }
        } catch (error) {
            console.error("Error toggling like:", error);
            showMessage("Network error. Please try again.", "error");
        }
    }

    async function fetchLiked() {
        if (!currentUser) return;
        
        showLoading('loadingLiked');
        try {
            const res = await fetch(`/api/liked/${currentUser.user_id}`);
            const data = await res.json();
            renderTracks(data, 'likedResults');
            hideLoading('loadingLiked');
            if (data.length === 0) {
                showEmptyState('emptyLiked');
            }
        } catch (error) {
            console.error("Error fetching liked songs:", error);
            hideLoading('loadingLiked');
            showEmptyState('emptyLiked');
            showMessage("Failed to load liked songs", "error");
        }
    }

    async function checkIfLiked(id) {
        if (!currentUser || !id) return;
        
        try {
            const res = await fetch(`/api/liked/${currentUser.user_id}`);
            const data = await res.json();
            const isLiked = data.some(s => s.id === id);
            document.getElementById('likeBtn').classList.toggle('liked', isLiked);
        } catch (error) {
            console.error("Error checking liked status:", error);
        }
    }

    // --- UTILITY FUNCTIONS ---
    function showLoading(elementId) {
        document.getElementById(elementId).classList.remove('hidden');
    }
    
    function hideLoading(elementId) {
        document.getElementById(elementId).classList.add('hidden');
    }
    
    function showEmptyState(elementId) {
        document.getElementById(elementId).classList.remove('hidden');
    }
    
    function hideEmptyState(elementId) {
        document.getElementById(elementId).classList.add('hidden');
    }
    
    // Auto-load trending on page load
    window.addEventListener('load', function() {
        // Check if user is already logged in (for future sessions)
        const savedUser = localStorage.getItem('vofoUser');
        if (savedUser) {
            try {
                currentUser = JSON.parse(savedUser);
                document.getElementById('authOverlay').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                fetchTrending();
            } catch (e) {
                localStorage.removeItem('vofoUser');
            }
        }
    });
</script>
</body>
</html>
